<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adeel Khatri</title>
  <meta name="description" content="Adeel Khatri — mathematics and computer science at NYU Courant." />
  <link rel="icon" type="image/x-icon" href="/favicon.jpeg" />

  <!-- Source Serif for the prose, Plex Mono for the labels. Both have local
       fallbacks in styles.css, so the page is readable before either lands. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap" />

  <script>
    // Stamp the edition before first paint so the page never flashes the
    // wrong one: the reader's saved choice, else whatever the system says.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
