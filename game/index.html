<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Secret Game</title>
  <meta name="description" content="A new dungeon every day.">
  <link rel="icon" href="/favicon.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --dark: #231F20;
      --light: #FFFFFF;
      --accent: #E23840;
      --bg: light-dark(var(--light), var(--dark));
      --fg: light-dark(var(--dark), var(--light));
      color-scheme: light dark;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    a {
      color: var(--accent);
    }

    button {
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid;
      padding: 2px 10px;
      cursor: pointer;
    }

    #menu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(340px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      background: var(--bg);
      border: 1px solid;
      padding: 8px 20px 12px;
    }

    #menu[hidden],
    #pad[hidden] {
      display: none;
    }

    #menu h2 {
      font-size: 1em;
      border-bottom: 1px solid;
      margin: 8px 0;
    }

    #menu table {
      width: 100%;
    }

    #menu td:last-child {
      text-align: right;
    }

    #menu td button {
      min-width: 100px;
    }

    .dim {
      font-size: 13px;
      opacity: 0.6;
    }

    #pad {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
    }

    #pad div {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #pad button {
      border-radius: 50%;
      width: 44px;
      height: 44px;
      padding: 0;
    }

    #pad .big {
      width: 68px;
      height: 68px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <canvas id="c"></canvas>

  <div id="pad" hidden>
    <div>
      <button data-a="menu">≡</button>
      <button data-a="lb">REST</button>
      <button data-a="rb">MAP</button>
    </div>
    <div>
      <button class="big" data-a="b">B</button>
      <button class="big" data-a="a">A</button>
    </div>
  </div>

  <div id="menu" hidden>
    <h2>Settings</h2>
    <table id="binds"></table>
    <p><button id="reset">Reset controls</button> <a href="/">Back to the site</a></p>
    <p class="dim">Move one tile per press. A picks up, takes the stairs, or waits a turn. B opens your bag. LB rests
      until healed. RB shows the map. Click a key to rebind it.</p>
  </div>

  <script src="/game/enemies.js"></script>
  <script>
    const T = 8;
    const MW = 44, MH = 30;
    const SIGHT = 7;
    const FONT = '8px "Press Start 2P", monospace';
    const RED = '#E23840';

    const $ = id => document.getElementById(id);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const STEPS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

    const dateKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const today = dateKey(new Date());

    function hashStr(s) {
      let h = 2166136261;
      for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }

    function rng(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const pick = (r, list) => list[Math.floor(r() * list.length)];

    const meta = { best: 0, runs: 0, unlocks: [], kills: 0, deaths: 0, deepest: 0, giant: false, dragon: false, known: [] };

    const UNLOCKS = [
      { id: 'satchel', name: 'Satchel', text: 'start with a healing potion', when: () => meta.deepest >= 3 },
      { id: 'leathers', name: 'Old leathers', text: 'start in leather armor', when: () => meta.deaths >= 3 },
      { id: 'hearty', name: 'Hearty', text: '+5 max HP', when: () => meta.kills >= 25 },
      { id: 'blade', name: "Giant's blade", text: 'start with a sword', when: () => meta.giant },
      { id: 'cartographer', name: 'Cartographer', text: 'start with a scroll of mapping', when: () => meta.deepest >= 8 },
      { id: 'slayer', name: 'Dragonslayer', text: '+1 attack', when: () => meta.dragon },
    ];
    const unlocked = id => meta.unlocks.includes(id);

    function checkUnlocks() {
      const fresh = UNLOCKS.filter(u => !unlocked(u.id) && u.when());
      for (const u of fresh) meta.unlocks.push(u.id);
      return fresh;
    }

    const WEAPONS = [{ name: 'Dagger', atk: 1 }, { name: 'Sword', atk: 3 }, { name: 'Spear', atk: 4 }, { name: 'Axe', atk: 5 }];
    const ARMORS = [{ name: 'Leather', def: 1 }, { name: 'Chain mail', def: 2 }, { name: 'Plate', def: 3 }];
    const MODS = { keen: 'often hits twice as hard', vampiric: 'heals you when it hits', heavy: '+2 attack' };
    const POTIONS = { heal: 'healing', strength: 'strength', vigor: 'vigor', poison: 'poison', clarity: 'clarity' };
    const SCROLLS = { map: 'mapping', teleport: 'teleport', blast: 'blasting', enchant: 'enchanting' };

    function looks(day) {
      const r = rng(hashStr(day + 'looks'));
      const colours = ['murky', 'fizzy', 'cloudy', 'inky', 'pale', 'bubbling', 'smoky', 'oily'].sort(() => r() - 0.5);
      const syl = ['ka', 'zun', 'mor', 'el', 'vi', 'tho', 'ra', 'quo', 'ne', 'lix', 'ap', 'du'];
      const out = {};
      Object.keys(POTIONS).forEach((id, i) => out[id] = colours[i] + ' potion');
      for (const id of Object.keys(SCROLLS)) out[id] = 'scroll "' + (pick(r, syl) + pick(r, syl) + ' ' + pick(r, syl) + pick(r, syl)).toUpperCase() + '"';
      return out;
    }

    function itemName(it) {
      if (it.kind === 'weapon') return (it.plus ? (it.plus > 0 ? '+' : '') + it.plus + ' ' : '') + (it.mod ? it.mod + ' ' : '') + WEAPONS[it.base].name.toLowerCase();
      if (it.kind === 'armor') return (it.plus ? (it.plus > 0 ? '+' : '') + it.plus + ' ' : '') + ARMORS[it.base].name.toLowerCase();
      if (!run.known.includes(it.id)) return run.looks[it.id];
      return it.kind === 'potion' ? 'potion of ' + POTIONS[it.id] : 'scroll of ' + SCROLLS[it.id];
    }

    function rollItem(r, depth) {
      const k = r();
      if (k < 0.38) return { kind: 'potion', id: pick(r, ['heal', 'heal', 'heal', 'strength', 'vigor', 'poison', 'clarity']) };
      if (k < 0.62) return { kind: 'scroll', id: pick(r, ['map', 'teleport', 'blast', 'blast', 'enchant']) };
      const plus = Math.floor(r() * (depth / 4 + 1)) - (r() < 0.15 ? 1 : 0);
      if (k < 0.82) return { kind: 'weapon', base: Math.min(3, Math.floor(r() * (1.5 + depth / 3))), plus, mod: r() < 0.25 ? pick(r, Object.keys(MODS)) : null };
      return { kind: 'armor', base: Math.min(2, Math.floor(r() * (1.2 + depth / 5))), plus };
    }

    const price = it => it.kind === 'potion' || it.kind === 'scroll' ? 15 : it.kind === 'weapon' ? 20 + WEAPONS[it.base].atk * 8 + it.plus * 10 : 25 + ARMORS[it.base].def * 12 + it.plus * 10;

    function spawn(r, depth, at) {
      const pool = Object.entries(ENEMIES).filter(([, e]) => !e.boss && e.floors[0] <= depth && depth <= e.floors[1]);
      let roll = r() * pool.reduce((s, [, e]) => s + (e.weight || 1), 0), key = pool[0][0];
      for (const [k, e] of pool) if ((roll -= e.weight || 1) <= 0) { key = k; break; }
      const e = ENEMIES[key], past = depth - e.floors[0], hp = Math.round(e.hp * (1 + past * 0.15));
      return { key, ...at, hp, max: hp, atk: e.atk + Math.floor(past / 2), def: e.def + Math.floor(past / 4), awake: false, energy: 0 };
    }

    function genFloor(depth) {
      const r = rng(hashStr(run.day) ^ Math.imul(depth, 0x9E3779B1));
      const g = Array.from({ length: MH }, () => Array(MW).fill('#'));
      const rooms = [];
      for (let i = 0; i < 80 && rooms.length < 10; i++) {
        const w = 4 + Math.floor(r() * 7), h = 3 + Math.floor(r() * 5);
        const x = 1 + Math.floor(r() * (MW - w - 2)), y = 1 + Math.floor(r() * (MH - h - 2));
        if (rooms.some(o => x < o.x + o.w + 1 && o.x < x + w + 1 && y < o.y + o.h + 1 && o.y < y + h + 1)) continue;
        rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
      }
      rooms.sort((a, b) => a.cx - b.cx);
      for (const rm of rooms) for (let y = rm.y; y < rm.y + rm.h; y++) for (let x = rm.x; x < rm.x + rm.w; x++) g[y][x] = '.';
      const dig = (a, b) => {
        const flip = r() < 0.5;
        const [mx, my] = flip ? [b.cx, a.cy] : [a.cx, b.cy];
        for (let x = Math.min(a.cx, b.cx); x <= Math.max(a.cx, b.cx); x++) g[flip ? a.cy : b.cy][x] = '.';
        for (let y = Math.min(a.cy, b.cy); y <= Math.max(a.cy, b.cy); y++) g[y][flip ? b.cx : a.cx] = '.';
        return [mx, my];
      };
      for (let i = 1; i < rooms.length; i++) dig(rooms[i - 1], rooms[i]);
      for (let i = 0; i < 2; i++) dig(pick(r, rooms), pick(r, rooms));

      const start = rooms[0], end = rooms[rooms.length - 1];
      g[end.cy][end.cx] = '>';
      const used = new Set([start.cx + ',' + start.cy, end.cx + ',' + end.cy]);
      const spot = (avoidStart = true) => {
        for (let i = 0; i < 100; i++) {
          const rm = avoidStart ? rooms[1 + Math.floor(r() * (rooms.length - 1))] : pick(r, rooms);
          const x = rm.x + Math.floor(r() * rm.w), y = rm.y + Math.floor(r() * rm.h);
          if (g[y][x] === '.' && !used.has(x + ',' + y)) { used.add(x + ',' + y); return { x, y }; }
        }
        return null;
      };

      const monsters = [];
      const cycle = Math.floor((depth - 1) / 10), bossKey = Object.keys(ENEMIES).find(k => ENEMIES[k].boss === (depth - 1) % 10 + 1);
      if (bossKey) {
        const e = ENEMIES[bossKey];
        monsters.push({ key: bossKey, x: end.cx - 1, y: end.cy, hp: e.hp * (1 + cycle), atk: e.atk + cycle * 4, def: e.def + cycle * 2, awake: false, energy: 0, boss: true });
        monsters[0].max = monsters[0].hp;
      }
      for (let i = 0; i < 4 + depth; i++) {
        const at = spot();
        if (at) monsters.push(spawn(r, depth, at));
      }

      const items = [];
      for (let i = 0; i < 3 + Math.floor(r() * 3); i++) { const at = spot(false); if (at) items.push({ ...at, item: rollItem(r, depth) }); }
      for (let i = 0; i < 3 + Math.floor(r() * 3); i++) { const at = spot(false); if (at) items.push({ ...at, gold: 3 + Math.floor(r() * (4 + depth * 3)) }); }

      let merchant = null;
      if (depth % 3 === 0 && !bossKey) {
        const at = spot();
        if (at) merchant = { ...at, wares: [rollItem(r, depth + 2), rollItem(r, depth + 2), { kind: 'potion', id: 'heal' }] };
      }

      return {
        depth, g, seen: Array.from({ length: MH }, () => Array(MW).fill(0)), monsters, items, merchant,
        start: { x: start.cx, y: start.cy }, sealed: !!bossKey,
      };
    }

    let run = null, floor = null, view = new Set(), screen = 'title', cursor = 0, deathNote = null, newUnlocks = [];

    const stat = {
      max: () => 20 + (run.p.level - 1) * 4 + run.p.vigor + (unlocked('hearty') ? 5 : 0),
      atk: () => 2 + run.p.level + run.p.str + (unlocked('slayer') ? 1 : 0) +
        (run.p.weapon ? WEAPONS[run.p.weapon.base].atk + run.p.weapon.plus + (run.p.weapon.mod === 'heavy' ? 2 : 0) : 0),
      def: () => Math.floor(run.p.level / 3) + (run.p.armor ? ARMORS[run.p.armor.base].def + run.p.armor.plus : 0),
    };
    const needXp = level => 8 + level * 8;

    function newRun() {
      run = {
        day: today, depth: 1, turns: 0, kills: 0, log: [], looks: looks(today), known: [...meta.known],
        p: {
          x: 0, y: 0, hp: 1, level: 1, xp: 0, str: 0, vigor: 0, poison: 0, gold: 0, inv: [],
          weapon: { kind: 'weapon', base: unlocked('blade') ? 1 : 0, plus: 0, mod: null },
          armor: unlocked('leathers') ? { kind: 'armor', base: 0, plus: 0 } : null
        },
      };
      if (unlocked('satchel')) run.p.inv.push({ kind: 'potion', id: 'heal' });
      if (unlocked('cartographer')) run.p.inv.push({ kind: 'scroll', id: 'map' });
      run.p.hp = stat.max();
      meta.runs++;
      enterFloor(1);
      say('Floor 1. Find the stairs down.');
    }

    function enterFloor(depth) {
      run.depth = depth;
      floor = genFloor(depth);
      run.p.x = floor.start.x; run.p.y = floor.start.y;
      meta.deepest = Math.max(meta.deepest, depth);
      meta.best = Math.max(meta.best, depth);
      look();
      if (floor.sealed) say('A heavy presence fills this floor. The stairs are sealed.');
    }

    function say(text) {
      run.log.push(text);
      if (run.log.length > 40) run.log.shift();
    }

    const tile = (x, y) => (floor.g[y] && floor.g[y][x]) || '#';
    const monsterAt = (x, y) => floor.monsters.find(m => m.x === x && m.y === y);
    const blocks = (x, y) => tile(x, y) === '#' || !!monsterAt(x, y) || (floor.merchant && floor.merchant.x === x && floor.merchant.y === y);

    function look() {
      view = new Set();
      const { x: px, y: py } = run.p;
      for (let a = 0; a < 360; a += 2) {
        const dx = Math.cos(a * Math.PI / 180), dy = Math.sin(a * Math.PI / 180);
        let x = px + 0.5, y = py + 0.5;
        for (let i = 0; i <= SIGHT; i++) {
          const tx = Math.floor(x), ty = Math.floor(y);
          if (ty < 0 || ty >= MH || tx < 0 || tx >= MW) break;
          view.add(tx + ',' + ty);
          floor.seen[ty][tx] = 1;
          if (floor.g[ty][tx] === '#') break;
          x += dx; y += dy;
        }
      }
    }
    const visible = (x, y) => view.has(x + ',' + y);

    function name(m) { return 'the ' + ENEMIES[m.key].name.toLowerCase(); }
    const cap = s => s[0].toUpperCase() + s.slice(1);

    function hitMonster(m) {
      const w = run.p.weapon;
      if (Math.random() < 0.1) return say('You miss ' + name(m) + '.');
      const crit = Math.random() < (w && w.mod === 'keen' ? 0.25 : 0.06);
      const dmg = Math.max(1, stat.atk() + rint(-1, 1) - m.def) * (crit ? 2 : 1);
      m.hp -= dmg;
      m.awake = true;
      m.flash = 0.2;
      if (w && w.mod === 'vampiric') run.p.hp = Math.min(stat.max(), run.p.hp + 1);
      if (m.hp > 0) return say((crit ? 'A great hit! ' : '') + 'You hit ' + name(m) + ' for ' + dmg + '.');
      kill(m);
    }

    function kill(m) {
      floor.monsters.splice(floor.monsters.indexOf(m), 1);
      say(cap(name(m)) + ' dies.');
      run.kills++;
      meta.kills++;
      gainXp(ENEMIES[m.key].xp);
      if (m.boss) {
        floor.sealed = false;
        if (m.key === 'giant') meta.giant = true;
        if (m.key === 'dragon') meta.dragon = true;
        say('The stairs grind open.');
      }
    }

    function gainXp(n) {
      const p = run.p;
      p.xp += n;
      while (p.xp >= needXp(p.level)) {
        p.xp -= needXp(p.level);
        const before = stat.max();
        p.level++;
        p.hp += stat.max() - before;
        say('You reach level ' + p.level + '!');
      }
    }

    function hitPlayer(m, shot) {
      if (Math.random() < 0.2) return say(cap(name(m)) + (shot ? ' shoots and misses.' : ' misses.'));
      const dmg = Math.max(1, m.atk + rint(-1, 1) - stat.def());
      run.p.hp -= dmg;
      run.p.flash = 0.25;
      say(cap(name(m)) + (shot ? ' shoots you for ' : ' hits you for ') + dmg + '.');
      if (ENEMIES[m.key].poison && Math.random() < ENEMIES[m.key].poison && !run.p.poison) { run.p.poison = 5; say('You are poisoned!'); }
      if (run.p.hp <= 0) die('Killed by ' + ENEMIES[m.key].name.toLowerCase());
    }

    function stepToward(m, tx, ty, away) {
      const dx = Math.sign(tx - m.x) * (away ? -1 : 1), dy = Math.sign(ty - m.y) * (away ? -1 : 1);
      const options = Math.abs(tx - m.x) > Math.abs(ty - m.y) ? [[dx, 0], [0, dy]] : [[0, dy], [dx, 0]];
      for (const [ox, oy] of options) {
        if ((ox || oy) && !blocks(m.x + ox, m.y + oy) && !(m.x + ox === run.p.x && m.y + oy === run.p.y)) { m.x += ox; m.y += oy; return; }
      }
    }

    function randomStep(m) {
      const [ox, oy] = Object.values(STEPS)[rint(0, 3)];
      if (!blocks(m.x + ox, m.y + oy) && !(m.x + ox === run.p.x && m.y + oy === run.p.y)) { m.x += ox; m.y += oy; }
    }

    function clearShot(m) {
      const dx = Math.sign(run.p.x - m.x), dy = Math.sign(run.p.y - m.y);
      for (let x = m.x + dx, y = m.y + dy; x !== run.p.x || y !== run.p.y; x += dx, y += dy) if (blocks(x, y)) return false;
      return true;
    }

    function monsterTurn(m) {
      const e = ENEMIES[m.key], p = run.p;
      if (visible(m.x, m.y)) m.awake = true;
      if (!m.awake) { if (Math.random() < 0.3) randomStep(m); return; }
      const dx = p.x - m.x, dy = p.y - m.y, d = Math.abs(dx) + Math.abs(dy);
      if (e.ai === 'ranged' && (dx === 0 || dy === 0) && d > 1 && d <= e.range && clearShot(m)) return hitPlayer(m, true);
      if (d === 1) return hitPlayer(m);
      if (e.ai === 'erratic' && Math.random() < 0.5) return randomStep(m);
      if (e.ai === 'ranged' && d < 3) return stepToward(m, p.x, p.y, true);
      if (e.ai === 'coward' && m.hp < m.max * 0.3) return stepToward(m, p.x, p.y, true);
      stepToward(m, p.x, p.y);
    }

    function endTurn() {
      const p = run.p;
      run.turns++;
      if (p.poison > 0) {
        p.poison--;
        p.hp--;
        if (p.hp <= 0) return die('Died of poison');
      } else if (run.turns % 15 === 0) p.hp = Math.min(stat.max(), p.hp + 1);
      look();
      if (run.turns % 50 === 0 && Math.random() < 0.6) {
        for (let n = 0; n < 50; n++) {
          const x = rint(1, MW - 2), y = rint(1, MH - 2);
          if (tile(x, y) !== '.' || blocks(x, y) || visible(x, y)) continue;
          floor.monsters.push({ ...spawn(Math.random, run.depth, { x, y }), awake: true });
          break;
        }
      }
      for (const m of [...floor.monsters]) {
        m.energy += ENEMIES[m.key].speed || 1;
        while (m.energy >= 1 && run) { m.energy--; monsterTurn(m); }
      }
      if (run) look();
    }

    function die(cause) {
      const p = run.p;
      meta.deaths++;
      deathNote = { cause, depth: run.depth, level: p.level, gold: p.gold, kills: run.kills, turns: run.turns, day: run.day };
      newUnlocks = checkUnlocks();
      run = null;
      screen = 'dead';
    }

    function tryMove(dir) {
      const [dx, dy] = STEPS[dir], p = run.p, x = p.x + dx, y = p.y + dy;
      const m = monsterAt(x, y);
      if (m) { hitMonster(m); return endTurn(); }
      if (floor.merchant && floor.merchant.x === x && floor.merchant.y === y) { screen = 'shop'; cursor = 0; return; }
      if (tile(x, y) === '#') return;
      p.x = x; p.y = y;
      const here = floor.items.filter(i => i.x === x && i.y === y);
      for (const g of here.filter(i => i.gold)) {
        p.gold += g.gold;
        say('You pick up ' + g.gold + ' gold.');
        floor.items.splice(floor.items.indexOf(g), 1);
      }
      const it = floor.items.find(i => i.x === x && i.y === y && i.item);
      if (it) say('You see a ' + itemName(it.item) + '. (A to pick up)');
      if (tile(x, y) === '>') say(floor.sealed ? 'The stairs are sealed.' : 'Stairs down. (A to descend)');
      endTurn();
    }

    function act() {
      const p = run.p, it = floor.items.find(i => i.x === p.x && i.y === p.y && i.item);
      if (it) {
        if (p.inv.length >= 10) return say('Your bag is full.');
        p.inv.push(it.item);
        floor.items.splice(floor.items.indexOf(it), 1);
        say('You pick up the ' + itemName(it.item) + '.');
        return endTurn();
      }
      if (tile(p.x, p.y) === '>') {
        if (floor.sealed) return say('The stairs are sealed. Something guards this floor.');
        enterFloor(run.depth + 1);
        say('You go down to floor ' + run.depth + '.');
        const fresh = checkUnlocks();
        for (const u of fresh) say('Unlocked: ' + u.name + ' (' + u.text + ').');
        return;
      }
      endTurn();
    }

    function rest() {
      const awake = () => floor.monsters.some(m => visible(m.x, m.y));
      if (awake()) return say('Not with enemies in sight.');
      let n = 0;
      while (run && run.p.hp < stat.max() && !awake() && n++ < 100) endTurn();
      if (run) say(awake() ? 'Something is coming!' : 'You rest.');
    }

    function know(id) {
      if (run.known.includes(id)) return;
      run.known.push(id);
      if (!meta.known.includes(id)) meta.known.push(id);
    }

    function use(i) {
      const p = run.p, it = p.inv[i];
      if (it.kind === 'weapon' || it.kind === 'armor') {
        const slot = it.kind;
        p.inv.splice(i, 1);
        if (p[slot]) p.inv.push(p[slot]);
        p[slot] = it;
        say('You equip the ' + itemName(it) + '.' + (it.mod ? ' It ' + MODS[it.mod] + '.' : ''));
        return endTurn();
      }
      p.inv.splice(i, 1);
      know(it.id);
      if (it.kind === 'potion') {
        if (it.id === 'heal') { p.hp = Math.min(stat.max(), p.hp + Math.max(10, Math.round(stat.max() / 2))); p.poison = 0; say('You feel much better.'); }
        if (it.id === 'strength') { p.str++; say('You feel stronger!'); }
        if (it.id === 'vigor') { p.vigor += 5; p.hp += 5; say('You feel hardier. +5 max HP.'); }
        if (it.id === 'poison') { p.poison = 6; say('Yuck! It was poison.'); }
        if (it.id === 'clarity') { p.inv.forEach(x => x.id && know(x.id)); say('Your head clears. You know what everything you carry does.'); }
      } else {
        if (it.id === 'map') { floor.seen = floor.seen.map(r => r.map(() => 1)); say('The floor\'s layout fills your mind.'); }
        if (it.id === 'teleport') {
          for (let n = 0; n < 200; n++) {
            const x = rint(1, MW - 2), y = rint(1, MH - 2);
            if (tile(x, y) === '.' && !blocks(x, y)) { p.x = x; p.y = y; break; }
          }
          say('The world lurches. You are somewhere else.');
        }
        if (it.id === 'blast') {
          const hit = floor.monsters.filter(m => visible(m.x, m.y));
          say(hit.length ? 'Fire bursts from the scroll!' : 'Fire bursts from the scroll, and hits nothing.');
          for (const m of hit) { m.hp -= 8 + run.depth; m.awake = true; m.flash = 0.3; }
          for (const m of hit.filter(m => m.hp <= 0)) kill(m);
        }
        if (it.id === 'enchant') { p.weapon.plus++; say('Your ' + itemName(p.weapon) + ' glows.'); }
      }
      endTurn();
    }

    function buy(i) {
      const w = floor.merchant.wares[i], cost = price(w);
      if (run.p.gold < cost) return say('"Not enough gold, friend."');
      if (run.p.inv.length >= 10) return say('Your bag is full.');
      run.p.gold -= cost;
      run.p.inv.push(w);
      floor.merchant.wares.splice(i, 1);
      say('You buy the ' + itemName(w) + '.');
    }

    const ACTIONS = { up: 'Up', down: 'Down', left: 'Left', right: 'Right', a: 'A', b: 'B', lb: 'LB', rb: 'RB' };
    const DEFAULTS = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', a: 'KeyO', b: 'KeyP', rb: 'KeyK', lb: 'KeyL' };
    const ARROWS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    let binds = { ...DEFAULTS };
    try { Object.assign(binds, JSON.parse(localStorage.getItem('game-binds')) || {}); } catch { }
    const keyName = code => (code || '-').replace(/^Key|^Digit/, '').replace(/^Arrow/, '');

    const keyDown = new Set(), padDown = new Set(), touchDown = new Set();
    let waiting = null;

    addEventListener('keydown', e => {
      if (waiting) {
        e.preventDefault();
        if (e.code !== 'Escape') {
          const other = Object.keys(binds).find(a => binds[a] === e.code);
          if (other) binds[other] = binds[waiting];
          binds[waiting] = e.code;
          try { localStorage.setItem('game-binds', JSON.stringify(binds)); } catch { }
        }
        waiting = null;
        drawMenu();
        return;
      }
      if (e.code === 'Escape') return toggleMenu();
      const a = Object.keys(binds).find(a => binds[a] === e.code) || ARROWS[e.code];
      if (a) { keyDown.add(a); e.preventDefault(); }
    });
    addEventListener('keyup', e => {
      for (const a in binds) if (binds[a] === e.code) keyDown.delete(a);
      if (ARROWS[e.code]) keyDown.delete(ARROWS[e.code]);
    });
    addEventListener('blur', () => keyDown.clear());

    const PAD = { 0: 'a', 1: 'b', 4: 'lb', 5: 'rb', 12: 'up', 13: 'down', 14: 'left', 15: 'right', 8: 'menu', 9: 'menu' };
    function pollPad() {
      padDown.clear();
      for (const gp of (navigator.getGamepads && navigator.getGamepads()) || []) {
        if (!gp) continue;
        for (const i in PAD) if (gp.buttons[i] && gp.buttons[i].pressed) padDown.add(PAD[i]);
        if (gp.axes[0] < -0.5) padDown.add('left');
        if (gp.axes[0] > 0.5) padDown.add('right');
        if (gp.axes[1] < -0.5) padDown.add('up');
        if (gp.axes[1] > 0.5) padDown.add('down');
      }
    }

    const cv = $('c');
    const touch = matchMedia('(pointer: coarse)').matches;
    let pointer = null;
    $('pad').hidden = !touch;
    cv.addEventListener('pointerdown', e => {
      if (screen === 'bag' || screen === 'shop') {
        const k = (devicePixelRatio || 1) / K, row = Math.floor((e.clientY * k - listBox.y) / 11);
        const count = screen === 'bag' ? run.p.inv.length : floor.merchant.wares.length;
        if (row >= 0 && row < count) { if (row === cursor) touchDown.add('a'), setTimeout(() => touchDown.delete('a'), 50); cursor = row; }
        return;
      }
      pointer = e;
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => { if (pointer) pointer = e; });
    cv.addEventListener('pointerup', () => pointer = null);
    cv.addEventListener('pointercancel', () => pointer = null);
    for (const btn of $('pad').querySelectorAll('button')) {
      btn.addEventListener('pointerdown', e => { e.preventDefault(); touchDown.add(btn.dataset.a); });
      for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, () => touchDown.delete(btn.dataset.a));
    }

    function drawMenu() {
      $('binds').innerHTML = '';
      for (const a in ACTIONS) {
        const row = $('binds').insertRow();
        row.insertCell().textContent = ACTIONS[a];
        const btn = document.createElement('button');
        btn.textContent = waiting === a ? 'press a key' : keyName(binds[a]);
        btn.onclick = () => { waiting = a; drawMenu(); };
        row.insertCell().append(btn);
      }
    }
    $('reset').onclick = () => {
      binds = { ...DEFAULTS };
      try { localStorage.removeItem('game-binds'); } catch { }
      drawMenu();
    };

    function toggleMenu() {
      waiting = null;
      $('menu').hidden = !$('menu').hidden;
      keyDown.clear();
      if (document.activeElement) document.activeElement.blur();
      drawMenu();
    }

    const g = cv.getContext('2d');
    const vc = document.createElement('canvas');
    const v = vc.getContext('2d');
    let W, H, K, VW, VH, padH;
    function resize() {
      const dpr = devicePixelRatio || 1;
      W = cv.width = Math.round(innerWidth * dpr);
      H = cv.height = Math.round(innerHeight * dpr);
      K = Math.max(2, Math.round(Math.min(W, H) / 215));
      VW = Math.ceil(W / K); VH = Math.ceil(H / K);
      vc.width = VW; vc.height = VH;
      padH = touch ? Math.ceil(96 * dpr / K) : 0;
    }
    addEventListener('resize', resize);
    resize();

    let mapBox = { px: 0, py: 0 }, listBox = { y: 0 };

    let held = new Set(), prev = new Set(), repeatAt = 0, halted = false, last = performance.now();
    function frame(now) {
      const dt = clamp((now - last) / 1000, 0, 0.1);
      last = now;
      pollPad();
      const before = prev;
      held = new Set([...keyDown, ...padDown, ...touchDown]);
      if (pointer && screen === 'play') {
        const k = (devicePixelRatio || 1) / K;
        const tx = pointer.clientX * k - mapBox.px, ty = pointer.clientY * k - mapBox.py;
        if (Math.abs(tx) > T / 2 || Math.abs(ty) > T / 2) held.add(Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 'right' : 'left') : (ty > 0 ? 'down' : 'up'));
        else held.add('a');
      } else if (pointer) held.add('a');
      prev = held;
      const hit = a => held.has(a) && !before.has(a);

      if (hit('menu')) toggleMenu();
      if ($('menu').hidden) input(hit, now);
      if (run) for (const m of floor.monsters) if (m.flash) m.flash = Math.max(0, m.flash - dt);
      if (run && run.p.flash) run.p.flash = Math.max(0, run.p.flash - dt);
      draw();
      requestAnimationFrame(frame);
    }

    function input(hit, now) {
      if (screen === 'title') {
        if (hit('a')) { newRun(); screen = 'play'; pointer = null; }
        return;
      }
      if (screen === 'dead') { if (hit('a')) screen = 'title'; return; }
      if (screen === 'map') { if (hit('rb') || hit('b') || hit('a')) screen = 'play'; return; }
      if (screen === 'bag' || screen === 'shop') {
        const list = screen === 'bag' ? run.p.inv : floor.merchant.wares;
        if (hit('up')) cursor = Math.max(0, cursor - 1);
        if (hit('down')) cursor = Math.min(list.length - 1, cursor + 1);
        if (hit('b')) screen = 'play';
        else if (hit('a') && list.length) {
          if (screen === 'bag') { screen = 'play'; use(cursor); }
          else { buy(cursor); cursor = Math.min(cursor, floor.merchant.wares.length - 1); }
        } else if (hit('lb') && screen === 'bag' && list.length) {
          const [it] = run.p.inv.splice(cursor, 1);
          floor.items.push({ x: run.p.x, y: run.p.y, item: it });
          say('You drop the ' + itemName(it) + '.');
          cursor = Math.max(0, Math.min(cursor, run.p.inv.length - 1));
        }
        return;
      }
      if (hit('b')) { screen = 'bag'; cursor = 0; return; }
      if (hit('rb')) { screen = 'map'; return; }
      if (hit('lb')) return rest();
      if (hit('a')) return act();
      const dir = Object.keys(STEPS).find(d => held.has(d));
      if (!dir) { halted = false; return; }
      const fresh = Object.keys(STEPS).find(d => hit(d));
      if (fresh) { halted = false; repeatAt = now + 220; return walk(fresh); }
      if (!halted && now >= repeatAt) { repeatAt = now + 110; walk(dir); }
    }

    function walk(dir) {
      const seenBefore = floor.monsters.filter(m => visible(m.x, m.y)).length;
      tryMove(dir);
      if (run && floor.monsters.filter(m => visible(m.x, m.y)).length > seenBefore) halted = true;
    }

    const ART = {
      wall: ['########', '#...#...', '########', '..#...#.', '########', '#...#...', '########', '..#...#.'],
      floor: ['........', '........', '........', '...#....', '........', '........', '........', '........'],
      stairs: ['########', '#.......', '#.######', '#.#.....', '#.#.####', '#.#.#...', '#.#.#.##', '#.#.#.#.'],
      sealed: ['########', '#......#', '#.####.#', '#.#..#.#', '#.#..#.#', '#.####.#', '#......#', '########'],
      player: ['...##...', '...##...', '..####..', '.#.##.#.', '...##...', '..#..#..', '..#..#..', '........'],
      potion: ['........', '...##...', '...##...', '..####..', '.#....#.', '.######.', '..####..', '........'],
      scroll: ['........', '.######.', '..#..#..', '..####..', '..#..#..', '..####..', '.######.', '........'],
      weapon: ['.......#', '......#.', '.....#..', '....#...', '.#.#....', '..#.....', '.#.#....', '#.......'],
      armor: ['........', '.##..##.', '.######.', '..####..', '..####..', '..####..', '...##...', '........'],
      gold: ['........', '........', '...##...', '..#..#..', '..#.....', '..#..#..', '...##...', '........'],
      merchant: ['.######.', '..####..', '...##...', '..####..', '.######.', '..####..', '..#..#..', '..#..#..'],
    };

    function bake(rows, color) {
      const c = document.createElement('canvas');
      c.width = c.height = rows.length;
      const x = c.getContext('2d');
      x.fillStyle = color;
      rows.forEach((row, y) => [...row].forEach((ch, i) => ch === '#' && x.fillRect(i, y, 1, 1)));
      return c;
    }

    const darkMode = matchMedia('(prefers-color-scheme: dark)');
    let ink, paper, img = {};
    function theme() {
      ink = darkMode.matches ? '#FFFFFF' : '#231F20';
      paper = darkMode.matches ? '#231F20' : '#FFFFFF';
      for (const k in ART) img[k] = bake(ART[k], k === 'player' ? RED : ink);
      img.dim = bake(ART.wall, darkMode.matches ? '#6E6A6B' : '#B9B7B8');
      for (const k in ENEMIES) { img['e_' + k] = bake(ENEMIES[k].art, ink); img['r_' + k] = bake(ENEMIES[k].art, RED); }
    }
    darkMode.addEventListener('change', theme);
    theme();

    function words(str, x, y, color = ink) { v.fillStyle = color; v.fillText(str, x, y); }

    function box(x, y, w, h) {
      v.fillStyle = paper;
      v.fillRect(x, y, w, h);
      v.fillStyle = ink;
      v.fillRect(x, y, w, 1); v.fillRect(x, y + h - 1, w, 1); v.fillRect(x, y, 1, h); v.fillRect(x + w - 1, y, 1, h);
    }

    function wrap(text, width) {
      const lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        if (line && (line + ' ' + word).length > width) { lines.push(line); line = word; }
        else line = line ? line + ' ' + word : word;
      }
      if (line) lines.push(line);
      return lines;
    }

    function arrow(x, y) { v.fillStyle = ink; for (let i = 0; i < 4; i++) v.fillRect(x + i, y + i, 1, 7 - i * 2); }

    function centred(lines, cols) {
      const out = lines.flatMap(([str, color]) => str ? wrap(str, cols - 1).map(l => [l, color]) : [['', color]]);
      const top = Math.max(10, Math.round((VH - padH) / 2 - out.length * 7));
      out.forEach(([str, color], i) => words(str, Math.round((VW - str.length * 8) / 2), top + i * 14, color));
    }

    function draw() {
      v.font = FONT;
      v.textBaseline = 'top';
      v.imageSmoothingEnabled = false;
      v.fillStyle = paper;
      v.fillRect(0, 0, VW, VH);
      const cols = Math.floor((VW - 8) / 8);

      if (screen === 'title') drawTitle(cols);
      else if (screen === 'dead') drawDead(cols);
      else {
        drawFloor(cols);
        if (screen === 'bag') drawList('BAG', run.p.inv.map(itemName), 'A use  LB drop  B close', cols);
        if (screen === 'shop') drawList('MERCHANT  ' + run.p.gold + 'G', floor.merchant.wares.map(w => itemName(w) + ' ' + price(w) + 'g'), 'A buy  B leave', cols);
        if (screen === 'map') drawMap();
      }

      g.imageSmoothingEnabled = false;
      g.drawImage(vc, 0, 0, VW * K, VH * K);
    }

    function drawTitle(cols) {
      const lines = [['DAILY DESCENT', RED], [today, ink], ['', ink]];
      if (meta.runs) lines.push(['Best floor: ' + meta.best + ', ' + meta.runs + (meta.runs === 1 ? ' run' : ' runs'), ink], ['', ink]);
      lines.push(["A  enter today's dungeon", ink]);
      const kept = UNLOCKS.filter(u => unlocked(u.id));
      if (kept.length) lines.push(['', ink], ['KEEPSAKES ' + kept.length + '/' + UNLOCKS.length, ink]);
      for (const u of kept) lines.push([u.name + ': ' + u.text, '#8E8A8B']);
      centred(lines, cols);
    }

    function drawDead(cols) {
      const d = deathNote;
      const lines = [['YOU DIED', RED], ['', ink], [d.cause + ' on floor ' + d.depth + '.', ink], ['', ink],
      ['Level ' + d.level + ', ' + d.kills + ' kills', ink], [d.gold + ' gold, ' + d.turns + ' turns', ink], ['', ink],
      ['Best floor: ' + meta.best, ink]];
      for (const u of newUnlocks) lines.push(['', ink], ['NEW KEEPSAKE', RED], [u.name + ': ' + u.text, ink]);
      lines.push(['', ink], ['A  back to the top', ink]);
      centred(lines, cols);
    }

    function drawFloor(cols) {
      const p = run.p, hudH = 14, logLines = 3, logH = logLines * 11 + 6;
      const mapH = VH - hudH - logH - padH;
      const px = Math.round(VW / 2 - T / 2), py = Math.round(hudH + mapH / 2 - T / 2);
      const ox = px - p.x * T, oy = py - p.y * T;
      mapBox = { px: px + T / 2, py: py + T / 2 };

      v.save();
      v.beginPath(); v.rect(0, hudH, VW, mapH); v.clip();
      for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
        if (!floor.seen[y][x]) continue;
        const sx = ox + x * T, sy = oy + y * T;
        if (sx < -T || sy < -T || sx > VW || sy > VH) continue;
        const t = floor.g[y][x], lit = visible(x, y);
        if (t === '#') v.drawImage(lit ? img.wall : img.dim, sx, sy);
        else if (t === '>') v.drawImage(floor.sealed ? img.sealed : img.stairs, sx, sy);
        else if (lit) v.drawImage(img.floor, sx, sy);
      }
      for (const it of floor.items) if (visible(it.x, it.y)) v.drawImage(img[it.gold ? 'gold' : it.item.kind], ox + it.x * T, oy + it.y * T);
      if (floor.merchant && floor.seen[floor.merchant.y][floor.merchant.x]) v.drawImage(img.merchant, ox + floor.merchant.x * T, oy + floor.merchant.y * T);
      for (const m of floor.monsters) {
        if (!visible(m.x, m.y)) continue;
        v.drawImage(img[(m.flash || m.boss ? 'r_' : 'e_') + m.key], ox + m.x * T, oy + m.y * T);
      }
      if (!p.flash || Math.floor(p.flash * 20) % 2) v.drawImage(img.player, px, py);
      v.restore();

      v.fillStyle = paper; v.fillRect(0, 0, VW, hudH);
      v.fillStyle = ink; v.fillRect(0, hudH - 1, VW, 1);
      const hpText = 'HP' + p.hp + '/' + stat.max();
      const parts = ['B' + run.depth, hpText, 'L' + p.level, p.gold + 'G'];
      let x = 4;
      for (const part of parts) { words(part, x, 3, part === hpText && (p.hp < stat.max() / 3 || p.poison) ? RED : ink); x += part.length * 8 + 8; }
      if (p.poison && x + 24 < VW) words('PSN', x, 3, RED);

      const top = VH - logH - padH;
      box(0, top, VW, logH);
      const lines = run.log.slice(-6).flatMap(l => wrap(l, cols - 1)).slice(-logLines);
      lines.forEach((l, i) => words(l, 5, top + 4 + i * 11, i === lines.length - 1 ? ink : '#8E8A8B'));
    }

    function drawList(title, items, help, cols) {
      const w = Math.min(VW - 8, cols * 8 + 4), fit = Math.floor((w - 12) / 8), p = run.p;
      const notes = (screen === 'bag' ? ['Wield: ' + itemName(p.weapon), 'Wear: ' + (p.armor ? itemName(p.armor) : 'nothing')] : [])
        .flatMap(l => wrap(l, fit)).concat(wrap(help, fit));
      const rows = Math.max(items.length, 1), h = 24 + rows * 11 + 6 + notes.length * 10 + 4;
      const x = Math.round((VW - w) / 2), y = Math.max(16, Math.round((VH - padH - h) / 2));
      box(x, y, w, h);
      words(title, x + 6, y + 6);
      listBox = { y: y + 22 - 2 };
      if (!items.length) words('(empty)', x + 14, y + 22);
      items.forEach((it, i) => {
        words(it.slice(0, Math.floor((w - 20) / 8)), x + 14, y + 22 + i * 11);
        if (i === cursor) arrow(x + 5, y + 22 + i * 11);
      });
      notes.forEach((l, i) => words(l, x + 6, y + 22 + rows * 11 + 6 + i * 10, '#8E8A8B'));
    }

    function drawMap() {
      const k = Math.max(1, Math.floor(Math.min((VW - 8) / MW, (VH - padH - 30) / MH)));
      const x0 = Math.round((VW - MW * k) / 2), y0 = Math.round((VH - padH - MH * k) / 2) + 6;
      box(x0 - 4, y0 - 16, MW * k + 8, MH * k + 20);
      words('FLOOR ' + run.depth, x0, y0 - 12);
      for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
        if (!floor.seen[y][x] || floor.g[y][x] === '#') continue;
        v.fillStyle = floor.g[y][x] === '>' ? RED : ink;
        v.fillRect(x0 + x * k, y0 + y * k, k, k);
      }
      v.fillStyle = RED;
      v.fillRect(x0 + run.p.x * k - 1, y0 + run.p.y * k - 1, k + 2, k + 2);
    }

    document.fonts && document.fonts.load(FONT);
    requestAnimationFrame(frame);
  </script>

</body>

</html>
